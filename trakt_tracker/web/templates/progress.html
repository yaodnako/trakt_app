{% extends "base.html" %}

{% block content %}
<section
    class="panel panel-hero"
    id="progress-page-root"
    data-hide-upcoming="{{ '1' if hide_upcoming else '0' }}"
    data-show-paused="{{ '1' if show_paused else '0' }}"
    data-show-dropped="{{ '1' if show_dropped else '0' }}"
    data-sort="{{ sort_mode }}"
    data-direction="{{ sort_direction }}"
    data-min-year="{{ min_year or '' }}"
    data-use-year-filter="{{ '1' if use_year_filter else '0' }}"
    data-progress-sync-running="{{ '1' if progress_sync_running else '0' }}"
>
    <div class="progress-toolbar">
        <label class="toggle-chip">
            <input type="checkbox" {% if hide_upcoming %}checked{% endif %} data-progress-toggle="hide_upcoming">
            <span>Hide Upcoming</span>
        </label>
        <label class="toggle-chip">
            <input type="checkbox" {% if show_paused %}checked{% endif %} data-progress-toggle="show_paused">
            <span class="progress-filter-label">
                <img class="progress-filter-icon progress-filter-icon-pause" src="{{ request.url_for('static', path='pause.svg') }}" alt="" aria-hidden="true">
                <span>Paused</span>
            </span>
        </label>
        <label class="toggle-chip">
            <input type="checkbox" {% if show_dropped %}checked{% endif %} data-progress-toggle="show_dropped">
            <span class="progress-filter-label">
                <img class="progress-filter-icon progress-filter-icon-drop" src="{{ request.url_for('static', path='drop_red.svg') }}" alt="" aria-hidden="true">
                <span>Dropped</span>
            </span>
        </label>
        <form method="get" action="/progress" class="progress-sort-form" data-progress-sort-form>
            <input type="hidden" name="hide_upcoming" value="{{ '1' if hide_upcoming else '0' }}">
            <input type="hidden" name="show_paused" value="{{ '1' if show_paused else '0' }}">
            <input type="hidden" name="show_dropped" value="{{ '1' if show_dropped else '0' }}">
            <input type="hidden" name="use_year_filter" value="{{ '1' if use_year_filter else '0' }}">
            <input type="hidden" name="min_year" value="{{ min_year or '' }}">
            <input type="hidden" name="direction" value="{{ sort_direction }}">
            <label class="progress-sort-field">
                <span class="visually-hidden">Sort Up next</span>
                <select name="sort" aria-label="Sort Up next" data-progress-sort-select data-progress-sort-mode="{{ sort_mode }}">
                    {% for value, label in progress_sort_options %}
                    <option value="{{ value }}" {% if sort_mode == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
            <button
                type="button"
                class="icon-button progress-sort-direction"
                data-progress-sort-direction
                aria-label="Sort {{ 'descending' if sort_direction == 'desc' else 'ascending' }}"
                title="Sort {{ 'descending' if sort_direction == 'desc' else 'ascending' }}"
            >{{ '↓' if sort_direction == 'desc' else '↑' }}</button>
        </form>
        <div class="year-filter-box">
            <form method="get" action="/progress" id="progress-year-filter-form" class="year-filter-form">
                <input type="hidden" name="hide_upcoming" value="{{ '1' if hide_upcoming else '0' }}">
                <input type="hidden" name="show_paused" value="{{ '1' if show_paused else '0' }}">
                <input type="hidden" name="show_dropped" value="{{ '1' if show_dropped else '0' }}">
                <input type="hidden" name="use_year_filter" value="{{ '1' if use_year_filter else '0' }}">
                <input type="hidden" name="sort" value="{{ sort_mode }}">
                <input type="hidden" name="direction" value="{{ sort_direction }}">
                <label class="toggle-chip">
                    <input
                        type="checkbox"
                        {% if use_year_filter %}checked{% endif %}
                        data-progress-year-toggle
                    >
                    <span>Year Filter</span>
                </label>
                <input
                    type="number"
                    name="min_year"
                    class="year-input"
                    placeholder="Year"
                    min="1900"
                    max="3000"
                    step="1"
                    value="{{ min_year or '' }}"
                >
            </form>
        </div>
    </div>
</section>

{% if rate_trakt_id %}
<div
    data-rating-autopen
    data-rating-title-type="show"
    data-rating-trakt-id="{{ rate_trakt_id }}"
    data-rating-title="{{ rate_title }}"
    data-rating-season="{{ rate_season or '' }}"
    data-rating-episode="{{ rate_episode or '' }}"
    hidden
></div>
{% endif %}

<div id="progress-sections-root">
{% include "progress_sections.html" %}
</div>
{% include "history_show_watch_overlay.html" %}
<script src="{{ request.url_for('static', path='history_watch_panel.js') }}?v={{ static_js_version }}"></script>
<script src="{{ request.url_for('static', path='progress_page.js') }}?v={{ static_js_version }}"></script>
{% endblock %}
