[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trakt-tracker"
version = "0.2.0b1"
description = "Windows-first Trakt web portal for movies and shows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "PySide6>=6.8.0",
  "SQLAlchemy>=2.0.0",
  "keyring>=25.0.0",
  "fastapi>=0.115.0",
  "Jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
]
release = [
  "pyinstaller==6.21.0",
]

[project.scripts]
trakt-tracker = "trakt_tracker.web_tray:main"
trakt-tracker-web = "trakt_tracker.web.main:main"
trakt-tracker-web-tray = "trakt_tracker.web_tray:main"

[tool.setuptools.packages.find]
include = ["trakt_tracker*"]
exclude = ["trakt_tracker.ui*"]

[tool.setuptools.package-data]
"trakt_tracker.web" = ["templates/*.html", "static/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
  "trakt_tracker/application/enrich_queue.py",
  "trakt_tracker/application/history_read_model.py",
  "trakt_tracker/application/services.py",
  "trakt_tracker/infrastructure/artwork_cache.py",
  "trakt_tracker/infrastructure/cache.py",
  "trakt_tracker/persistence/database.py",
  "trakt_tracker/persistence/repositories.py",
  "trakt_tracker/web/app.py",
  "trakt_tracker/web/runtime.py",
  "trakt_tracker/web/server.py",
]
